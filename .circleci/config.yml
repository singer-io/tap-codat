version: 2.1
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-codat
            source /usr/local/share/virtualenvs/tap-codat/bin/activate
            uv pip install .
      - run:
          name: 'JSON Validator'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json tap_codat/schemas/*.json
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-codat/bin/activate
            pylint tap_codat -d C,R,W
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-codat/bin/activate
            mkdir -p test_output
            pytest --cov=tap_codat --cov-report=term-missing --junitxml=test_output/unittests.xml tests/unittests
          when: always
      - run:
          name: 'Mocked Integration Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-codat/bin/activate
            pytest --cov=tap_codat --cov-report=term-missing --junitxml=test_output/mockedtests.xml tests/mockedtests -v
          when: always
      - run:
          name: 'Coverage Report'
          command: |
            source /usr/local/share/virtualenvs/tap-codat/bin/activate
            pytest --cov=tap_codat --cov-report=term-missing --junitxml=test_output/all_tests.xml tests/
            coverage html
          when: always
      - store_test_results:
          path: test_output
      - store_artifacts:
          path: htmlcov
      # TODO: Uncomment when credentials are available in CI environment
      # - run:
      #     name: 'Integration Tests'
      #     command: |
      #       source /usr/local/share/virtualenvs/tap-tester/bin/activate
      #       uv pip install --upgrade awscli
      #       uv pip install .
      #       aws s3 cp s3://com-stitchdata-dev-deployment-assets/environments/tap-tester/tap_tester_sandbox dev_env.sh
      #       source dev_env.sh
      #       unset USE_STITCH_BACKEND
      #       run-test --tap=tap-codat tests

workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
